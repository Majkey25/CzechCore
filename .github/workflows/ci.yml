name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,portable]"
      - run: python -m pip check
      - run: ct2-transformers-converter --help
      - run: python -m tools.research.validate_sources --schema-only
      - run: python -m tools.research.validate_taxonomy
      - run: python -m tools.research.build_coverage --check
      - run: python -m tools.research.validate_rewrite_cases
      - run: python -m pytest -m "not model" --cov=czechcore --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: python -m ruff check .
      - if: matrix.python-version == '3.12'
        run: python -m ruff format --check .
      - if: matrix.python-version == '3.12'
        run: python -m pyright --pythonpath "$(command -v python)"
