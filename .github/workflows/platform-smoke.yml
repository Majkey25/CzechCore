name: Platform model smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  model-smoke:
    name: Model smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            python: .platform-venv\Scripts\python.exe
            cli: .platform-venv\Scripts\czechcore.exe
            cache_path: |
              ~\AppData\Local\CzechCore
              ~\.cache\huggingface\hub\models--ufal--transformer-base-geccc-mate
          - name: macOS arm64
            os: macos-latest
            python: .platform-venv/bin/python
            cli: .platform-venv/bin/czechcore
            cache_path: |
              ~/.cache/czechcore
              ~/.cache/huggingface/hub/models--ufal--transformer-base-geccc-mate
          - name: Ubuntu x64
            os: ubuntu-latest
            python: .platform-venv/bin/python
            cli: .platform-venv/bin/czechcore
            cache_path: |
              ~/.cache/czechcore
              ~/.cache/huggingface/hub/models--ufal--transformer-base-geccc-mate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create clean virtual environment
        run: python -m venv .platform-venv

      - name: Download public v0.3.2 wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release
          for attempt in {1..12}; do
            if gh release download v0.3.2 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "czechcore-0.3.2-py3-none-any.whl" \
              --dir .release \
              --clobber; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Install public v0.3.2 wheel
        run: |
          ${{ matrix.python }} -m pip install --upgrade pip
          ${{ matrix.python }} -m pip install ".release/czechcore-0.3.2-py3-none-any.whl" pytest
          ${{ matrix.python }} -m pip check
          ${{ matrix.cli }} --version

      - name: Restore pinned model cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_path }}
          key: czechcore-v0.3.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/czechcore/assets.py') }}

      - name: czechcore download
        run: ${{ matrix.cli }} download

      - name: Run six real-model tests
        run: ${{ matrix.python }} -m pytest -m model tests/test_backend.py tests/test_tokenizer.py -q

      - name: Run live CLI scenarios
        run: |
          ${{ matrix.cli }} check "Když přišel domů šel spát."
          ${{ matrix.cli }} check --json "Muži přišly domů."
          ${{ matrix.cli }} check "Kontakt majkey25@example.cz, verze v1.2.3."
          ${{ matrix.cli }} check --autocorrect --min-confidence 0.90 "To je je vážný problém."
