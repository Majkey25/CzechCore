[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czechcore"
version = "0.1.0"
description = "Offline context-aware Czech grammar correction engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Majkey25" }]
keywords = ["czech", "grammar-correction", "nlp", "offline", "spellcheck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Czech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "huggingface-hub>=1.27,<2",
    "torch>=2.13,<3",
    "transformers>=5.15,<6",
    "ufal.udpipe>=1.4,<2",
]

[project.urls]
Homepage = "https://github.com/Majkey25/CzechCore"
Repository = "https://github.com/Majkey25/CzechCore"
Issues = "https://github.com/Majkey25/CzechCore/issues"
Changelog = "https://github.com/Majkey25/CzechCore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[project.scripts]
czechcore = "czechcore.cli:main"
czechcore-benchmark = "czechcore.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
czechcore = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["model: requires downloaded neural model assets"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
stubPath = "typings"

[tool.coverage.run]
branch = true
source = ["czechcore"]
